<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <div class="min-h-screen flex items-center justify-center">

    <div class="flex w-full max-w-6xl bg-white shadow-xl rounded-2xl overflow-hidden">

      <!-- LEFT SIDE (Hidden on mobile) -->
      <div class="hidden md:flex w-1/2 bg-gradient-to-r from-blue-500 to-blue-700 items-center justify-center p-8">
        <div class="text-white text-center">
          <h1 class="text-3xl font-bold mb-4">Welcome Back!</h1>
          <p class="text-sm opacity-90">
            Smart Digital Classroom System
          </p>
        </div>
      </div>

      <!-- RIGHT SIDE (Login Form) -->
      <div class="w-full md:w-1/2 p-6 sm:p-10">

        <h2 class="text-2xl sm:text-3xl font-semibold text-center text-blue-700 mb-6">
          Login to Your Account
        </h2>

        <form class="space-y-5">

          <!-- Email -->
          <div>
            <label class="block text-gray-600 mb-1 text-sm sm:text-base">
              Email
            </label>
            <input 
              type="email"
              placeholder="Enter your email"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm sm:text-base"
            >
          </div>

          <!-- Password -->
          <div>
            <label class="block text-gray-600 mb-1 text-sm sm:text-base">
              Password
            </label>
            <input 
              type="password"
              placeholder="Enter your password"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm sm:text-base"
            >
          </div>

          <!-- Button -->
          <button 
            type="submit"
            class="w-full bg-blue-600 text-white py-2 sm:py-3 rounded-lg hover:bg-blue-700 transition duration-300"
          >
            Login
          </button>

        </form>

        <!-- Signup -->
        <p class="text-xs sm:text-sm text-center text-gray-500 mt-5">
          Don’t have an account?
          <a href="#" class="text-blue-600 hover:underline">Sign Up</a>
        </p>

      </div>

    </div>

  </div>

</body>
</html>
